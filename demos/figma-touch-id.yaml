# The one example walkthrough. A CLI sign-in confirmed with Touch ID, where
# each button in the prompt is placed by the name of its layer in the design.
# `your-cli` and YourApp are made up, and nothing in this file is executed.
#
# This copy is the no-Figma case, and it is the one that ships:
#
#   assets/figma-touch-id/prompt.layers.json holds each layer's box in the
#   image's own pixels. It is written by hand, so the demo builds with no
#   Figma account, no link, and no token. The build reads that file, turns
#   every `layer` below into an `area`, and never contacts Figma.
#
# To drive the same file from a real design instead, add the frame's link to
# the image overlay and run `npm run figma`, which rewrites both the image and
# the positions file. Nothing else here changes:
#
#   figma: https://www.figma.com/design/<file>/<name>?node-id=12-34
#
# An image can also be used with no `actions` at all, in which case it is a
# screenshot the reader only looks at and the step never waits.
#
# See docs/authoring.md#images-from-figma.
title: Sign in to a CLI with Touch ID, from a design
description: >-
  Run a CLI command, confirm it's you with Touch ID, and continue in the
  terminal. Each button is placed by the name of its layer in the design.

theme:
  accent: "#0f7b6c"

terminal:
  cols: 80
  rows: 20

steps:
  - id: signin
    title: Run a command
    terminal:
      command: your-cli signin
      output: Waiting for Touch ID in YourApp...
    pause: 0.6

  - id: touch-id
    title: Touch the sensor to approve
    overlay:
      type: image
      src: assets/figma-touch-id/prompt.svg
      frame: false
      alt: >-
        YourApp asks to confirm that your-cli can sign in as Demo Account
        (demo@example.com), using Touch ID or a password.
      actions:
        # Each layer name is looked up in prompt.layers.json. Rename a layer
        # in the design and the build says so by name, instead of quietly
        # leaving the button in the wrong place.
        - label: Approve with Touch ID
          layer: fingerprint
        - label: Cancel
          style: secondary
          layer: cancel
          next: cancelled
    waitForAction: true

  - id: approved
    title: Touch ID approves the request
    overlay:
      type: image
      src: assets/figma-touch-id/prompt.svg
      animation: assets/figma-touch-id/prompt.css
      frame: false
      alt: The fingerprint is read, and YourApp shows Approved.
    pause: 1.2

  - id: signed-in
    title: Sign-in succeeds
    terminal:
      output: |
        Approved with Touch ID.
        Signed in as demo@example.com (session expires in 30 minutes)
    pause: 1

  - id: list-projects
    title: Run an authenticated command
    terminal:
      command: your-cli projects list
      output: |
        ID        NAME             UPDATED
        prj_001   Website          2 hours ago
        prj_002   Mobile app       yesterday
        prj_003   Internal tools   3 days ago
    pause: 2.5
    # The main path ends here. The next step is reached only by choosing Cancel.
    finish: true

  - id: cancelled
    title: If you cancel
    terminal:
      clear: true
      command: your-cli signin
      typing: false
      output: |
        Waiting for Touch ID in YourApp...
        Error: Touch ID was cancelled in YourApp.
        No session was created. Run `your-cli signin` to try again.
