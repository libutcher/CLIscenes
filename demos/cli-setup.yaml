# A fictional setup flow: install a CLI, turn on the desktop app settings it
# needs, and check the result. `cli-scenes` and YourApp are made up
# for this example, and nothing in this file is ever executed.
title: Install the CLI and connect it to the desktop app
description: >-
  Install the CLI, turn on the two desktop app settings that give the best
  setup, and check that everything is connected.
prerequisites:
  - YourApp 2.0 or later, installed and signed in
  - Homebrew, or another way to install command-line tools
layout: split

# Brand colors for this walkthrough only. Text on the accent and the
# dark-mode accent are worked out automatically.
theme:
  accent: "#0f7b6c"

terminal:
  cols: 64
  rows: 12

steps:
  - id: install
    title: Install the CLI
    terminal:
      command: brew install cli-scenes
      output: |
        ==> Downloading cli-scenes 2.4.0
        ==> Installing cli-scenes
        cli-scenes 2.4.0 is installed.
    pause: 1

  - id: verify
    title: Check the installed version
    terminal:
      command: cli-scenes --version
      output: cli-scenes 2.4.0
    pause: 1

  - id: unlock-setting
    title: Turn on fingerprint unlock
    overlay:
      type: settings-window
      title: YourApp — Settings
      nav: [General, Security, Developer, Advanced]
      section: Security
      settings:
        - label: Unlock with fingerprint
          description: Approve CLI requests with a touch instead of your password.
          toggle: false
          turnOn: true
        - label: Lock after the computer is idle for
          value: 30 minutes
        - label: Require your password after restarting
          toggle: true
    waitForAction: true

  - id: cli-setting
    title: Connect the desktop app to the CLI
    overlay:
      type: settings-window
      title: YourApp — Settings
      nav: [General, Security, Developer, Advanced]
      section: Developer
      settings:
        - label: Integrate with the CLI
          description: Sign in to the CLI through the desktop app, so no password or token is stored in your terminal.
          toggle: false
          turnOn: true
        - label: Ask before each new terminal session
          toggle: true
        - label: Show CLI activity in the app
          toggle: false
    waitForAction: true

  - id: check
    title: Check your setup
    terminal:
      clear: true
      command: cli-scenes whoami
      output: |
        Account:   Demo Account (demo@example.com)
        Sign-in:   through YourApp
        Unlock:    fingerprint
        Session:   active, ends after 30 minutes idle
    pause: 2.5
    overlay:
      type: settings-window
      title: YourApp — Settings
      nav: [General, Security, Developer, Advanced]
      section: Developer
      settings:
        - label: Integrate with the CLI
          toggle: true
        - label: Ask before each new terminal session
          toggle: true
        - label: Connected tools
          value: Terminal · cli-scenes 2.4.0
      annotations:
        - Setup is complete. The first command in each new terminal asks you to approve it, as in the sign-in walkthrough.
