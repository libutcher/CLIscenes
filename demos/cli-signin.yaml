# A fictional CLI sign-in flow. `your-cli` and YourApp are made up for this
# example: the command, dialog, and output are invented, and nothing in this
# file is ever executed.
title: Sign in to a CLI with a desktop app
description: >-
  Run a CLI command, approve the request in the desktop app, and continue in
  the terminal.
layout: overlay

# Brand colors for this walkthrough only. Text on the accent and the
# dark-mode accent are worked out automatically.
theme:
  accent: "#0f7b6c"

terminal:
  cols: 80
  rows: 20

steps:
  - id: signin
    title: Run a command
    terminal:
      command: your-cli signin
      output: Waiting for approval in YourApp...
    overlay:
      type: annotation
      text: The CLI asks the desktop app to confirm it's you, then waits.

  - id: approve
    title: Approve the sign-in request
    overlay:
      type: auth-prompt
      app: YourApp
      icon: assets/yourapp-icon.svg
      requester: Terminal
      title: Allow CLI sign-in?
      message: Terminal is running "your-cli signin" and wants to access your account.
      account:
        name: Demo Account
        email: demo@example.com
      verification: biometric
      actions:
        - label: Approve
          next: success
        - label: Deny
          style: secondary
          next: denied
    waitForAction: true

  - id: success
    title: Sign-in succeeds
    terminal:
      output: |
        Approved in the desktop app.
        Signed in as demo@example.com (session expires in 30 minutes)
    pause: 1.5
    overlay:
      type: annotation
      text: Return to the terminal. The CLI continues as soon as you approve.

  - id: list-projects
    title: Run an authenticated command
    terminal:
      command: your-cli projects list
      output: |
        ID        NAME             UPDATED
        prj_001   Website          2 hours ago
        prj_002   Mobile app       yesterday
        prj_003   Internal tools   3 days ago
    pause: 2
    # The main path ends here. The next step is reached only by choosing Deny.
    finish: true

  - id: denied
    title: If you deny the request
    terminal:
      clear: true
      command: your-cli signin
      output: |
        Waiting for approval in YourApp...
        Error: sign-in request was denied in the desktop app.
        No session was created. Run `your-cli signin` to try again.
    overlay:
      type: annotation
      text: If you deny the request, the CLI stops and nothing is unlocked. Go back to try again.
