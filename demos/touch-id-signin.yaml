# A fictional CLI sign-in confirmed with Touch ID. `your-cli` and YourApp are
# made up: the command, prompt, and output are invented, and nothing in this
# file is ever executed.
#
# The prompt is an image with clickable areas over the sensor and the Cancel
# button. Touching the sensor plays the approval animation; Cancel goes to a
# separate branch.
#
# Each click area here is a measured percentage, which someone has to measure
# again whenever the design moves. demos/figma-touch-id.yaml shows the same
# flow with each button placed by the name of its layer instead, so the
# positions come from a file that `npm run figma` can rewrite from the design.
# See docs/authoring.md#click-areas-from-layer-names.
title: Sign in to a CLI with Touch ID
description: >-
  Run a CLI command, confirm it's you with Touch ID in the desktop app, and
  continue in the terminal.

theme:
  accent: "#0f7b6c"

terminal:
  cols: 80
  rows: 20

steps:
  - id: signin
    title: Run a command
    terminal:
      command: your-cli signin
      output: Waiting for Touch ID in YourApp...
    pause: 0.6

  - id: touch-id
    title: Touch the sensor to approve
    overlay:
      type: image
      src: assets/touch-id-prompt.svg
      frame: false
      alt: >-
        YourApp asks to confirm that your-cli can sign in as Demo Account
        (demo@example.com), using Touch ID or a password.
      actions:
        - label: Approve with Touch ID
          area: { x: 41.76%, y: 58.6%, width: 16.47%, height: 15.05% }
        - label: Cancel
          style: secondary
          area: { x: 70.74%, y: 88.84%, width: 23.24%, height: 7.8% }
          next: cancelled
    waitForAction: true

  - id: approved
    title: Touch ID approves the request
    overlay:
      type: image
      src: assets/touch-id-prompt.svg
      animation: assets/touch-id-prompt.css
      frame: false
      alt: The fingerprint is read, and YourApp shows Approved.
    pause: 1.2

  - id: signed-in
    title: Sign-in succeeds
    terminal:
      output: |
        Approved with Touch ID.
        Signed in as demo@example.com (session expires in 30 minutes)
    pause: 1

  - id: list-projects
    title: Run an authenticated command
    terminal:
      command: your-cli projects list
      output: |
        ID        NAME             UPDATED
        prj_001   Website          2 hours ago
        prj_002   Mobile app       yesterday
        prj_003   Internal tools   3 days ago
    pause: 2.5
    # The main path ends here. The next step is reached only by choosing Cancel.
    finish: true

  - id: cancelled
    title: If you cancel
    terminal:
      clear: true
      command: your-cli signin
      typing: false
      output: |
        Waiting for Touch ID in YourApp...
        Error: Touch ID was cancelled in YourApp.
        No session was created. Run `your-cli signin` to try again.
