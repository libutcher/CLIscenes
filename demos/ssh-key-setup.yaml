# A hypothetical flow that moves between an app's settings, a browser, and the
# terminal. Shows the overlay layout and the app-window and image overlay types.
title: Turn on an SSH agent, then test it
description: >-
  Enable a setting in a desktop app, add your public key in the browser, and
  confirm the connection from the terminal.
layout: overlay

terminal:
  cols: 64
  rows: 10

steps:
  - id: settings
    title: Turn on the SSH agent
    overlay:
      type: app-window
      title: Password manager — Settings
      heading: Developer
      body: The SSH agent lets command-line tools use keys stored in the app without writing them to disk.
      fields:
        - label: Use the SSH agent
          value: "On"
        - label: Ask before using a key
          value: Every time
      actions:
        - label: Done
      annotations:
        - Select Done to return to the walkthrough.
    waitForAction: true

  - id: add-key
    title: Add your public key in the browser
    overlay:
      type: image
      src: assets/browser-add-key.svg
      alt: >-
        A browser window showing an "Add SSH key" form with a Title field and a
        Key field containing a public key that begins with ssh-ed25519.
      caption: Paste the public key into your Git host's SSH key settings.
    pause: 3

  - id: test
    title: Test the connection
    terminal:
      command: ssh -T git@git.example.com
      output: |
        Hi demo-user! You've successfully authenticated.
    pause: 2
    overlay:
      type: annotation
      text: The agent asks the app to approve each key use, so no private key leaves it.
